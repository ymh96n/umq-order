<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اطلب قهوتك — محمصة عُمق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe6;--card:#fffaf3;--ink:#2b1a10;--mut:#7a6552;--line:#e4d5c2;--acc:#5b3a24;--acc2:#b8895b;--ok:#2f7d4f;--wa:#1f9d55}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c130d;--card:#271a11;--ink:#f3e8da;--mut:#b9a48d;--line:#3d2b1d;--acc:#d9a56f;--acc2:#b8895b;--wa:#2bb673}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 140px}
header{text-align:center;padding:22px 0 10px}
header h1{margin:0;font-size:28px;font-weight:800;color:var(--acc);letter-spacing:.2px}
header p{margin:4px 0 0;color:var(--mut);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
.card h2{margin:0 0 8px;font-size:17px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ch{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.ph{flex:0 0 64px;width:64px;height:64px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#7b4a2b,#3b2314);display:flex;align-items:center;justify-content:center;font-size:30px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ds{margin:2px 0 0;color:var(--mut);font-size:14px;line-height:1.5}
.nm{font-weight:500}.pr{color:var(--mut);font-size:14px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;font-family:inherit;cursor:pointer;line-height:1}
.qty button:active{transform:scale(.94)}
.qty b{min-width:22px;text-align:center;font-size:17px}
.row.on .nm{color:var(--acc);font-weight:700}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input[type=tel]{direction:ltr;text-align:right}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{margin:0;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--ink);font-size:14px;background:var(--bg)}
.seg input{display:none}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){border-color:var(--acc);background:var(--acc);color:#fff}
.seg small{display:block;color:inherit;opacity:.8;font-size:12px}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.bar .in{max-width:560px;margin:0 auto}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:15px}
.tot b{font-size:22px;color:var(--acc)}
#send{width:100%;padding:14px;border:0;border-radius:14px;background:var(--wa);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
#send:disabled{opacity:.5}
#err{color:#b23b2e;font-size:14px;min-height:20px;margin:0 0 6px}
.mut{color:var(--mut);font-size:13px}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>☕ محمصة عُمق</h1><p>اختر قهوتك، وأرسل الطلب إلينا عبر واتساب</p></header>
<div id="menu"></div>
<div class="card"><h2>بياناتك</h2>
<label for="nm">الاسم</label><input id="nm" autocomplete="name">
<label for="ph">رقم الواتساب</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="9XXXXXXX">
</div>
<div class="card"><h2>الاستلام</h2>
<div class="seg">
<label><input type="radio" name="dl" value="pick" checked><span>استلام<small>مجاني</small></span></label>
<label><input type="radio" name="dl" value="office"><span>توصيل لمكتب<small id="f1"></small></span></label>
<label><input type="radio" name="dl" value="home"><span>توصيل لمنزل<small id="f2"></small></span></label>
</div>
<div id="locBox" style="display:none"><label for="loc">الموقع (العنوان أو رابط الخريطة)</label><input id="loc" placeholder="مثال: السيب، مقابل المسجد، أو رابط قوقل ماب"></div>
<p class="mut" style="margin:8px 0 0">التوصيل عبر جيناكم، وأجرته تُدفع عند الاستلام.</p>
</div>
<div class="card"><h2>كود خصم</h2>
<input id="cd" placeholder="إن كان لديك كود خصم اكتبه هنا" autocapitalize="off" autocomplete="off" style="direction:ltr;text-align:right">
<p id="cdm" class="mut" style="margin:6px 0 0;min-height:18px"></p></div>
<div class="card"><h2>ملاحظات</h2>
<textarea id="nt" rows="2" placeholder="درجة التحميص، نوع الطحن (مطحون / حبوب)، أو أي طلب خاص"></textarea></div>
<footer>محمصة عُمق — <span id="igl"></span></footer>
</div>
<div class="bar"><div class="in">
<div class="tot"><span>الإجمالي <span class="mut" id="cnt"></span></span><b id="tot">0.000 ر.ع</b></div>
<p id="err"></p>
<button id="send">إرسال الطلب عبر واتساب</button></div></div>
